<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&me FC 出店エリア判定ツール</title>
<style>
  :root { --p:#6b4fbb; --pl:#ede8f7; --txt:#2a2a33; --sub:#6a6a7c; --line:#e4e4ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; color:var(--txt); background:#fafafc; font-size:16px; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:28px 18px; }
  .k { color:var(--p); font-size:11px; font-weight:700; letter-spacing:.12em; }
  h1 { margin:2px 0 18px; font-size:20px; font-weight:900; }
  input { width:100%; border:1px solid #cfcfd8; border-radius:10px; padding:14px 16px; font-size:18px; font-family:inherit; background:#fff; }
  input.small { font-size:15px; padding:10px 14px; margin-top:8px; }
  .btn { border:none; background:var(--p); color:#fff; font-weight:700; font-size:17px; padding:14px; border-radius:10px; cursor:pointer; width:100%; margin-top:12px; }
  .hint { font-size:12px; color:var(--sub); margin-top:6px; }
  #result { display:none; margin-top:18px; }
  .verdict { border-radius:12px; padding:18px; }
  .verdict .big { font-size:28px; font-weight:900; line-height:1.3; }
  .verdict .why { font-size:15px; margin-top:6px; }
  .ok { background:#e3f3e6; color:#1f6a2e; }
  .c  { background:#fdf0d6; color:#8a5d0e; }
  .ng { background:#fbe3e3; color:#9e2f2f; }
  .ex { background:var(--pl); color:#4a2f98; }
  .rel { margin-top:12px; font-size:14px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .rel b { display:block; font-size:12px; color:var(--sub); margin-bottom:4px; }
  .foot { font-size:12px; color:var(--sub); margin-top:14px; }
  details { margin-top:36px; font-size:13px; color:var(--sub); }
  summary { cursor:pointer; font-weight:700; }
  textarea { width:100%; border:1px solid #cfcfd8; border-radius:8px; padding:10px; font-size:13px; font-family:ui-monospace,Menlo,monospace; min-height:160px; margin-top:8px; }
  .sbtn { border:1px solid var(--p); background:#fff; color:var(--p); font-weight:700; font-size:13px; padding:7px 12px; border-radius:8px; cursor:pointer; margin:8px 6px 0 0; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2a2a33; color:#fff; padding:8px 16px; border-radius:999px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <div class="k">&amp;me / FC AREA CHECK</div>
  <h1>出店エリア判定</h1>

  <input id="q" placeholder="希望エリア（例：姫路、池袋西口、天神）" autocomplete="off">
  <input id="owner" class="small" placeholder="オーナー名（既存オーナーの場合のみ）" autocomplete="off">
  <button class="btn" onclick="judge()">判定する</button>
  <div class="hint">市名・駅名・HPB小エリア名のどれでもOK</div>

  <div id="result">
    <div id="verdict" class="verdict"></div>
    <div id="rel"></div>
    <div class="foot">※方針v3に基づく仮判定。最終判断は本部・既存オーナー・希望オーナーの相談で決めます。</div>
  </div>

  <details>
    <summary>既存店マスタ・希望エリア（設定）</summary>
    <div class="hint" style="margin-top:8px">既存店：店名, 法人, 都道府県, 市区町村, HPB中エリア, HPB小エリア, 駅, 都心(1/0), 状態</div>
    <textarea id="csv"></textarea>
    <div class="hint" style="margin-top:12px">各法人の希望エリア：法人, 希望順位, 都道府県, 駅・エリア</div>
    <textarea id="wish" style="min-height:120px"></textarea>
    <button class="sbtn" onclick="save()">保存</button>
    <button class="sbtn" onclick="reset()">初期データに戻す</button>
    <span class="hint" id="info"></span>
    <div class="hint" style="margin-top:8px">出典：&me_出店希望エリア（2026.10.31時点）。HPB中・小エリア列は未入力。入れると都心部の判定がより細かくなります。</div>
  </details>
</main>
<div class="toast" id="toast"></div>

<script>
const SAMPLE = `# 店名, 法人, 都道府県, 市区町村, HPB中エリア, HPB小エリア, 駅, 都心(1/0), 状態
池袋店, ミレボ, 東京都, 豊島区, , , 池袋, 1, 出店済
恵比寿店, ハリカ, 東京都, 渋谷区, , , 恵比寿, 1, 出店済
吉祥寺店, コシキ, 東京都, 武蔵野市, , , 吉祥寺, 0, 出店済
錦糸町店, ミレボ, 東京都, 墨田区, , , 錦糸町, 1, 出店確定
横浜店, ミレボ, 神奈川県, 横浜市西区, , , 横浜, 1, 出店済
所沢店, コシキ, 埼玉県, 所沢市, , , 所沢, 0, 出店済
高崎店, コシキ, 群馬県, 高崎市, , , 高崎, 0, 出店済
千葉店, コシキ, 千葉県, 千葉市中央区, , , 千葉, 0, 出店確定
名駅店, ミレボ, 愛知県, 名古屋市中村区, , , 名古屋, 1, 出店済
名古屋伏見店, パティーナ, 愛知県, 名古屋市中区, , , 伏見, 1, 出店済
一宮店, 伊藤, 愛知県, 一宮市, , , 一宮, 0, 出店確定
梅田店, ハリカ, 大阪府, 大阪市北区, , , 梅田, 1, 出店済
心斎橋店, リアー, 大阪府, 大阪市中央区, , , 心斎橋, 1, 出店済
天王寺店, 直営, 大阪府, 大阪市天王寺区, , , 天王寺, 1, 出店済
中百舌鳥店, リアー, 大阪府, 堺市北区, , , 中百舌鳥, 0, 出店済
西宮北口店, 金本, 兵庫県, 西宮市, , , 西宮北口, 0, 出店済
神戸元町店, コシキ, 兵庫県, 神戸市中央区, , , 元町, 1, 出店済
塚口店, 金本, 兵庫県, 尼崎市, , , 塚口, 0, 出店確定
姫路店, 直営, 兵庫県, 姫路市, , , 姫路, 0, 出店済
加古川店, 直営, 兵庫県, 加古川市, , , 加古川, 0, 出店済
和歌山店, リアー, 和歌山県, 和歌山市, , , 和歌山, 0, 出店済
岡山店, 直営, 岡山県, 岡山市北区, , , 岡山, 0, 出店済
米子店, 直営, 鳥取県, 米子市, , , 米子, 0, 出店済
高松店, 直営, 香川県, 高松市, , , 高松, 0, 出店確定
博多駅筑紫口店, 直営, 福岡県, 福岡市博多区, , , 博多, 1, 出店済
博多駅博多口店, ミレボ, 福岡県, 福岡市博多区, , , 博多, 1, 出店確定
福岡天神店, リアー, 福岡県, 福岡市中央区, , , 天神, 1, 出店済
小倉店, ミレボ, 福岡県, 北九州市小倉北区, , , 小倉, 0, 出店済
鹿児島中山店, パティーナ, 鹿児島県, 鹿児島市, , , 中山, 0, 出店済
鹿児島天文館店, パティーナ, 鹿児島県, 鹿児島市, , , 天文館, 0, 出店済
那覇店, コシキ, 沖縄県, 那覇市, , , 那覇, 0, 出店確定`;
const SAMPLE_WISH = `# 法人, 希望順位, 都道府県, 駅・エリア
ミレボ, 1, 東京都, 錦糸町
ミレボ, 2, 東京都, 新宿
ミレボ, 3, 熊本県, 上通り
ミレボ, 4, 長崎県, 浜ノ町
ミレボ, 10, 鹿児島県, 鹿児島中央
コシキ, 1, 神奈川県, 茅ヶ崎
コシキ, 2, 神奈川県, 横浜
コシキ, 3, 神奈川県, 日吉
コシキ, 4, 大阪府, 梅田
コシキ, 5, 大阪府, 心斎橋
コシキ, 6, 沖縄県, 那覇
コシキ, 7, 東京都, 池袋
リアー, 1, 京都府, 四条烏丸・京都河原町
リアー, 2, 北海道, 札幌・大通
リアー, 3, 奈良県, 大和西大寺`;

function ls(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
function n(s){ return (s||'').replace(/[\s　]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase(); }
const ALIAS={'名駅':'名古屋','三ノ宮':'三宮','神戸三宮':'三宮','鹿児島天文館':'天文館','福岡天神':'天神','神戸元町':'元町','大阪梅田':'梅田'};
function core(s){ let x=n(s); for(const k in ALIAS) if(x.startsWith(n(k))) x=x.replace(n(k),n(ALIAS[k])); return x.replace(/駅$/,'').replace(/(東口|西口|南口|北口|周辺|エリア)/g,''); }
function cityCore(s){ return n(s).replace(/(市|区|町|村).*$/,''); }

function parse(t){ return t.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{ const c=l.split(/[,，]/).map(x=>x.trim());
  return {name:c[0]||'',owner:c[1]||'',pref:c[2]||'',city:c[3]||'',mid:c[4]||'',small:c[5]||'',st:c[6]||'',urban:c[7]==='1',status:c[8]||''}; }).filter(s=>s.name); }
function parseWish(t){ return t.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{ const c=l.split(/[,，]/).map(x=>x.trim());
  return {owner:c[0]||'',rank:c[1]||'',pref:c[2]||'',area:c[3]||''}; }).filter(w=>w.owner&&w.area); }
function load(){ document.getElementById('csv').value=ls('andme_stores3',SAMPLE); document.getElementById('wish').value=ls('andme_wish1',SAMPLE_WISH); info(); }
function save(){ lsSet('andme_stores3',document.getElementById('csv').value); lsSet('andme_wish1',document.getElementById('wish').value); info(); toast('保存しました'); }
function reset(){ document.getElementById('csv').value=SAMPLE; document.getElementById('wish').value=SAMPLE_WISH; save(); }
function info(){ document.getElementById('info').textContent=parse(document.getElementById('csv').value).length+' 店舗 / 希望 '+parseWish(document.getElementById('wish').value).length+' 件'; }

function judge(){
  const q=document.getElementById('q').value.trim(), owner=document.getElementById('owner').value.trim();
  if(!q){ toast('希望エリアを入れてください'); return; }
  const qc=core(q), qcity=cityCore(q), all=parse(document.getElementById('csv').value);
  const same=(a,b)=>a&&b&&a===b;
  let v,cls,why,rel=[];

  // 神戸 中央区例外
  if(/三宮|三ノ宮|元町|神戸市中央区/.test(q)){
    rel=all.filter(s=>n(s.city).includes('神戸市中央区'));
    if(!rel.length){ v='原則OK'; cls='ok'; why='三宮・元町に既存店がありません。'; }
    else if(rel.some(s=>same(n(s.owner),n(owner)))){ v='追加出店OK'; cls='ok'; why='三宮・元町は同一オーナーなら追加出店可。'; }
    else { v='同一オーナーのみ'; cls='ex'; why='三宮・元町は本部指定の例外。別オーナーの出店は認めていません。'; }
  } else {
    const hitSmall=all.filter(s=>same(n(s.small),n(q))||same(core(s.small),qc));
    const hitSt=all.filter(s=>!hitSmall.includes(s)&&(same(core(s.st),qc)||same(core(s.small),qc)));
    const hitMid=all.filter(s=>!hitSmall.includes(s)&&!hitSt.includes(s)&&(same(n(s.mid),n(q))||same(core(s.mid),qc)));
    const hitCity=all.filter(s=>{ const cc=cityCore(s.city); return same(cc,qcity)||(cc.length>=2&&n(q).startsWith(cc)); });
    const urbanHit=[...hitSmall,...hitSt,...hitMid].some(s=>s.urban)||hitCity.some(s=>s.urban);

    if(!urbanHit){ // 地方店は駅名・エリア名ヒットも「同じ市」として扱う
      for(const s of [...hitSmall,...hitSt,...hitMid]) if(!hitCity.includes(s)) hitCity.push(s);
    }
    if(urbanHit){ // 都心ロジック
      if(hitSmall.length){ v='既存オーナー＆本部相談'; cls='c'; rel=hitSmall; why='同じHPB小エリアに既存店があります。既存店が十分に回っていれば出店可。'; }
      else if(hitSt.length){ v='既存オーナー＆本部相談'; cls='c'; rel=hitSt; why='小エリアは別ですが同じ駅名の既存店があります。中エリア検索で同じ結果に並ぶため、既存オーナーと本部で相談してから決めます。'; }
      else if(hitMid.length){ v='原則OK'; cls='ok'; rel=hitMid; why='同じ中エリアに既存店はありますが、小エリア・駅が異なります。'; }
      else { v='原則OK'; cls='ok'; rel=hitCity; why='都心部です。同じ中・小エリアに既存店はありません。'; }
    } else { // 地方ロジック
      rel=hitCity;
      if(!hitCity.length){ v='原則OK'; cls='ok'; why='この市に既存店がありません。'; }
      else if(hitCity.some(s=>same(n(s.owner),n(owner)))){ v='追加出店OK'; cls='ok'; why='同一オーナーの市内追加出店は可（本部承認）。'; }
      else { v='原則NG'; cls='ng'; why='地方は1市1オーナー。同じ市に別オーナーの既存店があります。既存オーナーが了承すれば相談可。'; }
    }
  }
  const vd=document.getElementById('verdict'); vd.className='verdict '+cls;
  vd.innerHTML=`<div class="big">${v}</div><div class="why">${why}</div>`;
  document.getElementById('rel').innerHTML = rel.length ? `<div class="rel"><b>相談相手になる既存店</b>${rel.map(s=>`${s.name}（${s.owner}${s.status&&s.status!=='出店済'?'・'+s.status:''}）`).join('<br>')}</div>` : '';
  // 他法人の希望とバッティング
  const wishes=parseWish(document.getElementById('wish').value).filter(w=>w.owner!==owner&&(same(core(w.area),qc)||w.area.includes(q)||q.includes(w.area)));
  if(wishes.length){ document.getElementById('rel').innerHTML+=`<div class="rel"><b>このエリアを希望している他法人</b>${wishes.map(w=>`${w.owner}（第${w.rank}希望）`).join('<br>')}</div>`; }
  document.getElementById('result').style.display='block';
}
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') judge(); });
load();
</script>
</body>
</html>
