# ============================================================
#  口コミ返信テンプレート
#  {name} は business.yaml から置換。{customer} はお客様のお名前
#  (手動で差し替え)。そのままでもコピペ可。
#  ★返信のコツ
#   ・24〜48時間以内に返信する
#   ・可能ならお名前(○○様)で書き出す
#   ・テンプレ感を消すため、口コミ内の具体的な言葉を1つ盛り込む
#   ・施術内容など個人情報・病状に踏み込みすぎない
#   ・低評価ほど丁寧に。言い訳より「改善」と「感謝」を
# ============================================================

guide: |
  返信は「感謝 → 共感/具体 → 次回への一言」の3部構成が基本です。
  星が低い口コミも、誠実な返信は他の見込み客への信頼材料になります。

templates:
  - topic: "効果を実感(高評価)"
    stars: "★4〜5"
    body: |
      {customer}、この度は嬉しいお声をありがとうございます。
      お身体の変化を感じていただけて、私たちもとても嬉しいです。
      良い状態を保てるよう引き続きサポートいたしますので、
      またお気軽にお越しください。{name}

  - topic: "接客・対応への満足(高評価)"
    stars: "★4〜5"
    body: |
      {customer}、温かいお言葉をありがとうございます。
      安心してお過ごしいただけたようで何よりです。
      これからも一人ひとりに寄り添った対応を心がけてまいります。
      またのご来院を心よりお待ちしております。{name}

  - topic: "清潔感・雰囲気への満足(高評価)"
    stars: "★4〜5"
    body: |
      {customer}、ご来院と口コミありがとうございます。
      心地よい空間でリラックスしていただけたなら幸いです。
      引き続き清潔で落ち着いた環境づくりに努めてまいります。
      またお会いできるのを楽しみにしております。{name}

  - topic: "リピーター様へのお礼(高評価)"
    stars: "★4〜5"
    body: |
      {customer}、いつもご来院いただきありがとうございます。
      継続して頼っていただけることが何よりの励みです。
      お身体の変化に合わせて最適なケアをご提案してまいります。
      引き続きどうぞよろしくお願いいたします。{name}

  - topic: "改善要望・期待に届かなかった(低評価)"
    stars: "★1〜3"
    body: |
      この度はご来院いただいたにもかかわらず、ご期待に沿えず
      申し訳ございませんでした。いただいたご意見は真摯に受け止め、
      施術内容と対応を見直してまいります。
      差し支えなければ詳しくお話を伺えますと幸いです。
      お電話 {phone} までご連絡いただけますでしょうか。{name}

  - topic: "待ち時間・予約に関する不満(低評価)"
    stars: "★1〜3"
    body: |
      この度はお待たせしてしまい、申し訳ございませんでした。
      ご予約の枠と当日の進行を見直し、改善に努めてまいります。
      貴重なご指摘をいただきありがとうございます。
      次回はより快適にご利用いただけるよう努めます。{name}
