# ============================================================
#  and me 整体院 — 店舗マスタ情報 (NAP)
#  ★MEO・サイテーション対策の「単一の真実のソース」です。
#   ここだけ正確に埋めれば、Google投稿文・各ポータル掲載文・
#   口コミ返信・構造化データ・掲載トラッカーへ自動反映されます。
#
#  【最重要】NAP(名称 Name / 住所 Address / 電話 Phone)は
#   全媒体で “完全一致” させてください。表記ゆれはMEO評価を下げます。
#   ★ が付いた箇所は必ず実際の値に書き換えてください。
# ============================================================

# --- NAP(最重要・全媒体で完全一致) -------------------------
name: "and me（アンドミー）"        # ★正式名称(屋号)。スペース・記号も統一
name_kana: "アンドミー"             # ★フリガナ
name_romaji: "and me"              # 英語表記(海外/Apple Maps用・任意)

address:
  postal_code: "000-0000"          # ★郵便番号
  prefecture: "東京都"             # ★都道府県
  city: "渋谷区"                   # ★市区町村
  street: "〇〇1-2-3"              # ★町名・番地
  building: "〇〇ビル 2F"          # 建物名・階(無ければ "")

phone: "00-0000-0000"              # ★電話番号(ハイフン区切りで統一)
email: "info@example.com"          # 連絡用メール(任意)

# --- Web/予約 ----------------------------------------------
website: "https://example.com"     # ★公式サイトURL(無ければ "")
booking_url: "https://example.com/reserve"  # 予約ページURL(任意)

# --- カテゴリ(Googleビジネスプロフィールのカテゴリに合わせる) ---
primary_category: "整体院"          # ★主カテゴリ
additional_categories:             # 追加カテゴリ(任意)
  - "リラクゼーションサロン"
  - "マッサージ店"
schema_type: "HealthAndBeautyBusiness"  # 構造化データの型(通常このままでOK)

# --- 営業時間(曜日別 "HH:MM-HH:MM" / 休みは "定休") -----------
hours:
  mon: "10:00-20:00"
  tue: "10:00-20:00"
  wed: "定休"                       # ★定休日は "定休"
  thu: "10:00-20:00"
  fri: "10:00-20:00"
  sat: "10:00-18:00"
  sun: "10:00-18:00"
holiday_note: "祝日は不定休"        # 補足(任意)

# --- 料金/支払い -------------------------------------------
price_range: "¥¥"                  # Google表示用(¥〜¥¥¥¥)
payment_methods:                   # 支払い方法(任意)
  - 現金
  - クレジットカード
  - QRコード決済

# --- 対応エリア(MEOで狙う地域。最寄り順) --------------------
area_served:                       # ★院の商圏となる地域・駅名
  - "渋谷区"
  - "表参道"
  - "神宮前"

access:
  stations:                        # ★最寄駅(複数可・近い順)
    - name: "表参道"
      line: "東京メトロ"
      minutes: 5
  parking: "なし(近隣コインP有)"     # 駐車場(任意)

# --- MEOで狙うキーワード(地域×施術で自動展開されます) --------
target_keywords:                   # ★検索で上位を狙いたい施術キーワード
  - "整体"
  - "骨盤矯正"
  - "産後骨盤矯正"
  - "姿勢改善"
  - "肩こり"
  - "腰痛"
  - "女性専用整体"

# --- 施術メニュー(料金は税込・円の数値) ----------------------
services:                          # ★実際のメニューに置き換え
  - name: "骨盤矯正コース"
    price: 6600
    duration: 60
    desc: "出産や日常の姿勢の崩れで歪んだ骨盤を整え、土台から不調を改善します。"
  - name: "肩こり・首こり集中ケア"
    price: 5500
    duration: 45
    desc: "デスクワークやスマホ疲れによる肩・首のこりを的確にほぐします。"
  - name: "全身整体コース"
    price: 7700
    duration: 75
    desc: "全身のバランスを総合的に調整。慢性的な不調におすすめです。"

# --- 院の特徴(掲載文や投稿で活用) ---------------------------
