  - "女性専用・女性スタッフ在籍"
  - "完全予約制でゆったり施術"
  - "プライベートな個室空間"
  - "国家資格保有スタッフ"

# --- 紹介文(媒体の文字数に応じて自動で使い分け) -------------
description_short: "渋谷・表参道の女性専用整体。骨盤矯正と姿勢改善で根本ケア。"   # 〜50字目安
description_mid: "表参道駅徒歩5分の女性専用整体院 and me。骨盤矯正・産後ケア・姿勢改善を得意とし、完全予約制の個室で一人ひとりの不調に向き合います。"  # 〜120字目安
description_long: |                # 〜400字目安(ポータルの店舗紹介欄用)
  and me（アンドミー）は、渋谷・表参道エリアの女性専用整体院です。
  骨盤矯正・産後骨盤矯正・姿勢改善を中心に、肩こりや腰痛など慢性的な
  不調の“根本改善”を目指した施術を行っています。
  国家資格を持つ女性スタッフが、完全予約制のプライベートな個室空間で
  お一人おひとりの身体の状態に合わせて丁寧に対応。初めての方にも
  わかりやすくご説明し、無理な勧誘は一切いたしません。
  「身体を整えて、本来の自分に戻る」——そんな時間をご提供します。

